name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ta
          POSTGRES_PASSWORD: ta
          POSTGRES_DB: ta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ta" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TA_SECRET_KEY: ci-secret-key-at-least-32-characters-long
      # Name must end in _test: the test fixtures drop and recreate this database.
      TA_DATABASE_URL: postgresql+psycopg://ta:ta@localhost:5432/ta_test
      TA_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y libenchant-2-2 hunspell-en-us
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Generated client is current
        run: |
          python -m tools.dump_openapi > web/openapi.json
          cd web && npx --yes openapi-typescript@7.13.0 openapi.json -o src/api/schema.d.ts
          git diff --exit-code src/api/schema.d.ts

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --passWithNoTests
      - run: npm run build
      - run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ta
          POSTGRES_PASSWORD: ta
          POSTGRES_DB: ta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ta" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TA_SECRET_KEY: ci-secret-key-at-least-32-characters-long
      TA_E2E_DATABASE_URL: postgresql+psycopg://ta:ta@localhost:5432/ta_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y libenchant-2-2 hunspell-en-us
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
