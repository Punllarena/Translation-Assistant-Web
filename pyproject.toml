[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ta-web"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "pyenchant>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Raised by Starlette's TestClient on import when httpx is installed; not our code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["api*", "tools*"]

[tool.ruff.lint]
# Without an explicit select, ruff enforces only its default E4,E7,E9,F -- which
# silently dropped both the B008 ignore below and line-length (E501).
select = ["E", "F", "I", "B", "UP"]
# Depends() in a default argument is the FastAPI idiom, so B008 stays off.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; rewrapping its lines by hand would be undone by the next
# --autogenerate run, and the plan forbids hand-patching migrations.
"migrations/versions/*" = ["E501"]
