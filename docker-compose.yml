services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ta
      POSTGRES_PASSWORD: ta
      POSTGRES_DB: ta
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
