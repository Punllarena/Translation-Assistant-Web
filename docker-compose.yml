services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ta
      POSTGRES_PASSWORD: ta
      POSTGRES_DB: ta
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ta"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TA_SECRET_KEY: ${TA_SECRET_KEY:?set TA_SECRET_KEY in .env}
      TA_DATABASE_URL: postgresql+psycopg://ta:ta@postgres:5432/ta
      TA_DATA_DIR: /data
    volumes: ["ta_data:/data"]
    # Not published: only Caddy reaches it, which is what makes trusting
    # X-Forwarded-For (--forwarded-allow-ips in the Dockerfile) safe.
    expose: ["8000"]

  caddy:
    build: ./web
    depends_on: [api]
    environment:
      TA_SITE_ADDRESS: ${TA_SITE_ADDRESS:-localhost}
    ports: ["${TA_HTTP_PORT:-80}:80", "${TA_HTTPS_PORT:-443}:443"]
    volumes: ["caddy_data:/data"]

volumes:
  pgdata:
  caddy_data:
  ta_data:
